<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Link your That's Dinner account</title>
</head>
<body style="font-family:sans-serif;max-width:320px;margin:60px auto;">
  <h2>Link your That's Dinner account</h2>

  <div id="step1">
    <p><input id="email" type="email" placeholder="Email" required style="width:100%;padding:8px;" /></p>
    <button id="sendCodeBtn" style="width:100%;padding:10px;">Send code</button>
  </div>

  <div id="step2" style="display:none;">
    <p>Enter the code sent to your email:</p>
    <p><input id="code" type="text" placeholder="Verification code" required style="width:100%;padding:8px;" /></p>
    <button id="verifyBtn" style="width:100%;padding:10px;">Log in</button>
  </div>

  <p id="statusMsg" style="color:red;"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const redirectUri = params.get("redirect_uri") || "";
    const state = params.get("state") || "";
    const clientId = params.get("client_id") || "";
    const BASE = "https://zvdnibunhjqhxnmdfaea.supabase.co/functions/v1/alexa-oauth";

    document.getElementById("sendCodeBtn").onclick = async () => {
      const email = document.getElementById("email").value;
      const statusEl = document.getElementById("statusMsg");
      statusEl.textContent = "Sending...";
      try {
        const res = await fetch(BASE + "/send-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        if (!res.ok) throw new Error("Failed to send code");
        statusEl.style.color = "green";
        statusEl.textContent = "Code sent! Check your email.";
        document.getElementById("step1").style.display = "none";
        document.getElementById("step2").style.display = "block";
        document.getElementById("step2").dataset.email = email;
      } catch (e) {
        statusEl.style.color = "red";
        statusEl.textContent = "Could not send code. Check the email and try again.";
      }
    };

    document.getElementById("verifyBtn").onclick = async () => {
      const email = document.getElementById("step2").dataset.email;
      const code = document.getElementById("code").value;
      const statusEl = document.getElementById("statusMsg");
      statusEl.style.color = "black";
      statusEl.textContent = "Verifying...";
      try {
        const res = await fetch(BASE + "/verify-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, code, redirect_uri: redirectUri, state, client_id: clientId }),
        });
        const data = await res.json();
        if (!res.ok || !data.redirect_url) throw new Error(data.error || "Verification failed");
        window.location.href = data.redirect_url;
      } catch (e) {
        statusEl.style.color = "red";
        statusEl.textContent = "Invalid or expired code. Try again.";
      }
    };
  </script>
</body>
</html>
